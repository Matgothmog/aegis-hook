specVersion: 1.0.0
description: >
  Aegis watchtower. Indexes what a self-defending Uniswap v4 pool decided and why, so the data
  can answer whether a pool is under attack and how its circuit breaker should be tuned.
repository: https://github.com/Matgothmog/aegis-hook
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AegisHook
    network: unichain-testnet
    source:
      address: "0x295DB25bC9aE00ddC51C875F0FeC16a406a9eAc0"
      abi: AegisHook
      startBlock: 61677790
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Pool
        - MevTax
        - OracleSkipped
        - BlockCheckpoint
        - PoolDayData
      abis:
        - name: AegisHook
          file: ./abis/AegisHook.json
      eventHandlers:
        - event: PoolConfigured(indexed bytes32,(uint24,uint24,uint24,uint24,uint24,uint32,uint32,uint128,bool))
          handler: handlePoolConfigured
        - event: BlockCheckpointed(indexed bytes32,uint64,int24)
          handler: handleBlockCheckpointed
        - event: MevTaxApplied(indexed bytes32,indexed address,uint256,uint24,uint24)
          handler: handleMevTaxApplied
        - event: OracleUnavailable(indexed bytes32,uint8)
          handler: handleOracleUnavailable
        - event: OracleConfigured(indexed bytes32,address,uint24,uint32)
          handler: handleOracleConfigured
        - event: GuardianHalt(indexed bytes32,uint64)
          handler: handleGuardianHalt
